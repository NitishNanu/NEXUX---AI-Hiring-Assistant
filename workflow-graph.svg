  <path d="M800 597 V655" class="arrow"/>
  <path d="M800 597 V626 H1097.5 V655" class="arrow"/>
  <path d="M800 597 V626 H1392.5 V655" class="arrow"/>

  <path d="M325 686 H380" class="arrow-soft"/>
  <path d="M615 686 H680" class="arrow-soft"/>

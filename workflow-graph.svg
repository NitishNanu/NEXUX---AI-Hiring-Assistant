<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #102033; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #526273; }
      .box { fill: #ffffff; stroke: #b8c4d4; stroke-width: 2; rx: 14; }
      .box-blue { fill: #e9f2ff; stroke: #4b83d1; }
      .box-green { fill: #eaf8f0; stroke: #3f9b6d; }
      .box-orange { fill: #fff3e2; stroke: #dc8a2d; }
      .box-purple { fill: #f0ecff; stroke: #7b63c6; }
      .box-red { fill: #fff0f0; stroke: #d65c5c; }
      .label { font: 700 18px Arial, sans-serif; fill: #172334; }
      .small { font: 400 14px Arial, sans-serif; fill: #4d5b6a; }
      .arrow { stroke: #526273; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #7d8b99; stroke-width: 2; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 8 7; }
      .group-title { font: 700 20px Arial, sans-serif; fill: #26384d; }
      .group { fill: none; stroke: #d3dce8; stroke-width: 2; stroke-dasharray: 10 8; rx: 22; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#526273"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#7d8b99"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
